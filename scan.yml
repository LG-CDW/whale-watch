name: Whale Watch scanner

on:
  schedule:
    # Every 15 minutes, 9:00am-5:59pm Eastern on weekdays (covers both EST and EDT).
    # The script itself skips runs when the market is closed.
    - cron: "*/15 13-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whale-watch-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python alerts_job.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
